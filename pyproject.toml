[project]
name = "rogii-wellbore-geology"
version = "0.1.0"
description = "Kaggle ROGII Wellbore Geology Prediction (2026) — predict TVT along horizontal wellbores."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Vamsee Achanta", email = "vamsee.achanta@aceengineer.com" },
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "pyarrow>=17.0",
    "polars>=1.0",
]

[project.optional-dependencies]
ml = [
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "catboost>=1.2",
    "torch>=2.4",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "nbstripout>=0.7",
]
data = [
    "kaggle>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rogii"]

[tool.ruff]
line-length = 100
target-version = "py311"
